<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OfficeEditor — declarative document generation for DOCX, PPTX, and XLSX.">
  <title>OfficeEditor</title>
  <style>
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main { max-width: 640px; padding: 3rem 2rem; }
    h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); margin: 1rem 0; line-height: 1.6; }
    ul { list-style: none; margin: 1.5rem 0; display: flex; gap: 0.75rem; flex-wrap: wrap; }
    a {
      display: inline-block;
      padding: 0.5rem 1rem;
      border: 1px solid #334155;
      border-radius: 8px;
      color: var(--fg);
      text-decoration: none;
      font-size: 0.9rem;
      transition: border-color 0.15s, color 0.15s;
    }
    a:hover { border-color: var(--accent); color: var(--accent); }
    code { background: #1e293b; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.9em; }
    .muted { font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Office<span>Editor</span></h1>
    <p>
      Declarative document generation and rendering for <strong>DOCX</strong>, <strong>PPTX</strong>, and <strong>XLSX</strong> —
      one JSON-in, document-out story across the Office suite.
    </p>
    <ul>
      <li><a href="https://github.com/MaximeLeBesnerais/OfficeEditor">GitHub</a></li>
      <li><a href="/schemas/deck-2.0.json">PPTX generation schema</a></li>
    </ul>
    <p class="muted">Schemas are published here for machine resolution (JSON Schema <code>$id</code> references).</p>
  </main>
</body>
</html>
